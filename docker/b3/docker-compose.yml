
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: geodatos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  geoserver:
    image: docker.osgeo.org/geoserver:2.25.3
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgis

  pg_tileserv:
    image: pramsey/pg_tileserv:latest
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgis:5432/geodatos
    ports:
      - "127.0.0.1:7800:7800"
    depends_on:
      - postgis

volumes:
  pgdata:
