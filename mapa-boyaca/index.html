
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veredas de Boyacá - Visor SIG</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #mapa {
      height: 100%;
      width: 100%;
    }

    .titulo {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: white;
      padding: 12px 16px;
      border-radius: 6px;
      box-shadow: 0 2px 8px #0003;
      max-width: 280px;
    }

    .titulo h3 {
      margin: 0 0 6px;
    }

    .titulo p {
      margin: 0;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div id="mapa"></div>

  <div class="titulo">
    <h3>Veredas de Boyacá</h3>
    <p id="estado">Consultando servicio geográfico...</p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const mapa = L.map("mapa").setView(
      [5.5353, -73.3678], 8
    );

    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution: "© OpenStreetMap contributors",
        maxZoom: 19
      }
    ).addTo(mapa);

    const servicio =
      "https://services6.arcgis.com/Ex2fmFOuTOHRZtML/" +
      "ArcGIS/rest/services/Veredas_Boyaca_2024/" +
      "FeatureServer/0/query";

    const estado = document.getElementById("estado");

    const capaVeredas = L.geoJSON(null, {
      style: {
        color: "#176b45",
        weight: 1,
        fillColor: "#45b97c",
        fillOpacity: 0.35
      },

      onEachFeature: (entidad, capa) => {
        const p = entidad.properties || {};

        const vereda = p.NOMBRE_VER || "Sin nombre";
        const municipio = p.NOMB_MPIO || "Sin municipio";

        // Crear el contenido sin insertar HTML externo
        const contenedor = document.createElement("div");
        const titulo = document.createElement("strong");
        titulo.textContent = vereda;

        const detalle = document.createElement("div");
        detalle.textContent = "Municipio: " + municipio;

        contenedor.append(titulo, detalle);
        capa.bindPopup(contenedor);
      }
    }).addTo(mapa);

    async function cargarVeredas() {
      const bloque = 500;
      let offset = 0;
      let total = 0;

      try {
        while (true) {
          const params = new URLSearchParams({
            where: "1=1",
            outFields: "NOMB_MPIO,NOMBRE_VER",
            outSR: "4326",
            f: "geojson",
            resultOffset: String(offset),
            resultRecordCount: String(bloque)
          });

          const respuesta = await fetch(
            servicio + "?" + params.toString()
          );

          if (!respuesta.ok) {
            throw new Error("HTTP " + respuesta.status);
          }

          const datos = await respuesta.json();

          if (!Array.isArray(datos.features)) {
            throw new Error("Respuesta GeoJSON no válida");
          }

          const nuevos = datos.features;

          capaVeredas.addData(datos);
          total += nuevos.length;

          estado.textContent =
            "Veredas recuperadas: " + total;

          console.log(
            "Offset:", offset,
            "Recuperadas:", nuevos.length,
            "Total:", total
          );

          if (nuevos.length < bloque) {
            break;
          }

          offset += bloque;
        }

        if (total > 0) {
          mapa.fitBounds(capaVeredas.getBounds());
        }

        estado.textContent =
          "Veredas cargadas: " + total;

      } catch (error) {
        console.error(error);
        estado.textContent =
          "Error al consultar el servicio: " + error.message;
      }
    }

    cargarVeredas();
  </script>

</body>
</html>
